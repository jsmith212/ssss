# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "ssss"
arch: ${GOARCH}
platform: "linux"
version: "0.0.1"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Super Simple Sample Station: a sample manager"
vendor: "ssss"
license: "MIT"
release: "1"

contents:
  - src: "./bin/ssss"
    dst: "/usr/local/bin/ssss"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/ssss.png"
  - src: "./build/linux/ssss.desktop"
    dst: "/usr/share/applications/ssss.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
#
# All playback goes through Web Audio in WebKitGTK, which plays through
# GStreamer: without the base and good plugin sets the app runs but every
# sample is silent, with no error. The output element is a recommendation,
# not a dependency, so that PipeWire-only and PulseAudio-only systems both
# stay installable. Check the names against the release you target before
# publishing a package.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - gstreamer1.0-plugins-base
  - gstreamer1.0-plugins-good
recommends:
  - gstreamer1.0-pipewire
  - gstreamer1.0-pulseaudio

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
      - gstreamer1-plugins-base
      - gstreamer1-plugins-good
    recommends:
      - pipewire-gstreamer

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0
      - gst-plugins-base
      - gst-plugins-good

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
